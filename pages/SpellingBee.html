<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="../styles/style.css" />
</head>

<body>
    <button id="topBtn" onclick="scrollToTop()">↑ Top</button>
    <header>
        <nav>
            <div class="logo">Michael D. Galloway</div>
            <ul>
                <li><a href="../index.html">Home</a></li>
            </ul>
        </nav>
        <section class="hero">
            <h1>SpellingBee Clone Demo</h1>
            <p>
                <a href="#mdContent" class="btn">Project Info</a>
                <a href="https://github.com/MichaelGalloway404/ObjectRecognition" class="btn">Go to repo.</a>
            </p>
            <video class="vid" height="600" width="1150" controls>
                <source src="../media/spellingBeeDemoVid.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>
    </header>

    <div class="md-container">
        <div id="mdContent">
            <p class="md-popup" data-md="../markdown/spellingBee.md">
                Loading markdown...
            </p>
        </div>
    </div>

    <main>
        <section id="contact" class="contact">
            <h2>Contact</h2>
            <p>Email me at <a href="mailto:michael.d.galloway404@gmail.com">michael.d.galloway404@gmail.com</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Michael D. Galloway. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function loadMarkdown() {
            const mdFile = "../markdown/spellingBee.md";

            try {
                const response = await fetch(mdFile);
                const markdown = await response.text();

                document.getElementById("mdContent").innerHTML = marked.parse(markdown);
            } catch (err) {
                document.getElementById("mdContent").innerHTML = "<p>Failed to load markdown.</p>";
                console.error(err);
            }
        }

        loadMarkdown();


        // Scroll-to-top button
        const topBtn = document.getElementById("topBtn");

        window.onscroll = function () {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                topBtn.style.display = "block";
            } else {
                topBtn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    </script>
</body>

</html>
